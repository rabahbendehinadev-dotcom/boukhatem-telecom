kind = "mobile"
previewPath = "/mobile/"
title = "BOUKHATEM TELECOM Mobile"
description = "Application mobile BOUKHATEM TELECOM pour iOS et Android. Boutique de réparation et vente de téléphones en Algérie. Permet aux clients de parcourir le catalogue produits, gérer leur panier, passer des commandes et suivre leurs achats depuis leur smartphone."
version = "1.0.0"
id = "artifacts/repaire-phone-dz-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 23586

[services.development]
run = "pnpm --filter @workspace/repaire-phone-dz-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/repaire-phone-dz-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/repaire-phone-dz-mobile", "run", "serve" ]

[services.env]
PORT = "23586"
BASE_PATH = "/mobile/"
